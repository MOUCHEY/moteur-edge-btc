name: Qualification synthetique

# Aucun backtest de marche, lecture de coffre ou collecte dans ce workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: SHA complet de la base dont il faut conserver le journal
        required: true
        type: string

permissions:
  contents: read

jobs:
  mecanismes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /ci/
            /engine/
            /tests/
            /requirements.txt
            /PROTOCOLE.md
            /data/collect_forward.py
            /data/seal_vault.py
            /experiments/events/
            /experiments/ledger.json
            /experiments/*/spec.yaml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependances
        run: python -m pip install -r requirements.txt

      - name: Journal conserve et tests synthetiques
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: python ci/rejouer_local.py --base "$CI_BASE_SHA"
